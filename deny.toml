# cargo-deny configuration for wt.
#
# Run locally with:
#   cargo deny check
#
# Covers licenses and security advisories for the full dependency tree,
# including the ast-grep/tree-sitter grammar crates added for ast.v1.

[graph]
targets = []
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # smartstring (pulled in transitively by rhai, our rule-language
    # interpreter) is flagged unmaintained. It has no known vulnerability, no
    # safe upgrade exists yet, and rhai's `sync` feature pins it exactly; wt
    # never accepts untrusted Rhai source at runtime, only rule programs an
    # agent authored and wt itself validated. Revisit when rhai moves off it.
    "RUSTSEC-2026-0249",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates (wt-core, wt-runtime) are path dependencies with
# no version pin; that's fine, they're not resolved from a registry.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
