[workspace]
members = ["crates/wt-runtime", "crates/wt-core", "crates/wt-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "=1.12.2"
globset = "0.4"
tempfile = "3"
