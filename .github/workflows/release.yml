name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: wt-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag reachable from main and matches Cargo.toml version
        run: |
          git fetch origin main --quiet
          bash scripts/verify-release-tag.sh "${{ github.ref_name }}" origin/main
      - name: Release notes present in CHANGELOG.md
        run: bash scripts/release-notes.sh "${{ github.ref_name }}"

  ci:
    name: Full CI suite
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  build-linux-x86_64:
    name: Build Linux x86-64
    needs: [verify-tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build release assets
        run: bash build-linux-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wt-linux-x86_64
          path: |
            dist/wt-linux-x86_64.tar.gz
            dist/wt-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wt-linux-x86_64
          path: dist
      - name: Extract release notes
        run: bash scripts/release-notes.sh "${{ github.ref_name }}" > "${{ runner.temp }}/release-notes.md"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/wt-linux-x86_64.tar.gz
            dist/wt-linux-x86_64.tar.gz.sha256

  verify-install:
    name: Verify install from published release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install from the published release
        env:
          WT_VERSION: ${{ github.ref_name }}
          WT_INSTALL_DIR: ${{ runner.temp }}/wt-bin
        run: bash install.sh
      - name: Smoke test
        run: |
          "${{ runner.temp }}/wt-bin/wt" --version
          mkdir -p "${{ runner.temp }}/wt-check"
          cd "${{ runner.temp }}/wt-check"
          "${{ runner.temp }}/wt-bin/wt" check --no-global --allow-empty --format json
